version: "1.0"
environment: "production"

dependencies:
  postgres:
    type: "database"
    criticality: "critical"
    failure_action: "reject_traffic"
    traffic_action: "REJECT_TRAFFIC"
    timeout_ms: 3000
    max_latency_ms: 50.0
    retry_attempts: 3
    description: "PostgreSQL primary database storing task metadata and tenant state"

  redis:
    type: "queue_and_cache"
    criticality: "critical"
    failure_action: "reject_queue_operations"
    traffic_action: "REJECT_TRAFFIC"
    timeout_ms: 1000
    max_latency_ms: 20.0
    max_queue_depth: 1000
    description: "Redis queue broker and task state cache"

  storage:
    type: "document_store"
    criticality: "critical"
    failure_action: "reject_traffic"
    traffic_action: "REJECT_TRAFFIC"
    timeout_ms: 5000
    max_latency_ms: 100.0
    description: "Persistent document and artifact storage backend"

  gemini:
    type: "ai_provider"
    criticality: "important"
    failure_action: "degraded_mode"
    traffic_action: "THROTTLE_TRAFFIC"
    timeout_ms: 8000
    max_latency_ms: 2000.0
    fallback_strategy: "queue_for_retry"
    description: "Google Gemini AI model endpoint for document analysis"

  workers:
    type: "compute_pool"
    criticality: "critical"
    failure_action: "reject_traffic"
    traffic_action: "REJECT_TRAFFIC"
    timeout_ms: 2000
    min_available_capacity: 1
    description: "Celery/background task execution worker fleet"

  analytics:
    type: "telemetry"
    criticality: "optional"
    failure_action: "ignore"
    traffic_action: "ALLOW_TRAFFIC"
    timeout_ms: 500
    description: "Optional analytics and telemetry gathering service"
