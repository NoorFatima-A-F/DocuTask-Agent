[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-document-processing-platform"
version = "1.0.0"
description = "Enterprise AI Document Processing & Autonomous Workflow Platform"
authors = [{ name = "Principal AI & Platform Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.3",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.20",
    "rsa>=4.9",
    "httpx>=0.27.2",
    "google-genai>=0.1.1",
    "pdfplumber>=0.11.4",
    "pillow>=11.0.0",
    "pytesseract>=0.3.13"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit>=1.7.9"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests", "enterprise_audit_engine/tests"]
pythonpath = ["."]
