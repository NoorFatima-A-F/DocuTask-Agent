[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-document-processing-platform"
version = "1.0.0"
description = "Enterprise AI Document Processing & Autonomous Workflow Platform"
authors = [{ name = "Principal AI & Platform Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.3",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.20",
    "rsa>=4.9",
    "ecdsa>=0.19.3",
    "httpx>=0.27.2",
    "google-genai>=0.1.1",
    "pdfplumber>=0.11.4",
    "pillow>=11.0.0",
    "pytesseract>=0.3.13",
    "numpy>=1.26.0",
    "pyyaml>=6.0.2",
    "celery>=5.3.0",
    "redis>=5.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit>=1.7.9"
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2"
]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
asyncio_mode = "auto"
testpaths = ["tests", "enterprise_audit_engine/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E401",
    "E402",
    "E701",
    "E702",
    "E711",
    "E712",
    "E722",
    "E731",
    "E741",
    "W291",
    "W292",
    "W293",
    "W391",
    "F401",
    "F403",
    "F405",
    "F541",
    "F811",
    "F821",
    "F841",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = false
disable_error_code = ["import-untyped", "attr-defined", "name-defined", "type-arg"]
