[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docutask-agent"
version = "2.0.0"
description = "Document extraction service: OCR -> Gemini -> schema validation -> evidence-based confidence -> human review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "bcrypt>=4.2.0",
    "PyJWT>=2.10.0",
    "python-multipart>=0.0.20",
    "httpx>=0.27.2",
    "rapidfuzz>=3.9.0",
    "python-dateutil>=2.9.0",
    "pdfplumber>=0.11.4",
    "pillow>=11.0.0",
    "pytesseract>=0.3.13",
    "celery>=5.3.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "bandit>=1.7.9",
    "pip-audit>=2.7.0",
    "types-python-dateutil>=2.9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once by design.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.File", "fastapi.Body", "fastapi.Path",
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts and literal test credentials are expected.
"tests/**" = ["S101", "S105", "S106", "S108"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

# The whole application package is strict; tests are type-checked but not strict.
[[tool.mypy.overrides]]
module = ["app", "app.*"]
strict = true

[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["celery.*", "pytesseract.*", "pdfplumber.*", "kombu.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

