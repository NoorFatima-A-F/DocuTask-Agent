[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docutask-agent"
version = "2.0.0.dev0"
description = "Document extraction service: OCR -> Gemini -> schema validation -> evidence-based confidence -> human review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "bcrypt>=4.2.0",
    "PyJWT>=2.10.0",
    "python-multipart>=0.0.20",
    "httpx>=0.27.2",
    "rapidfuzz>=3.9.0",
    "python-dateutil>=2.9.0",
    "pdfplumber>=0.11.4",
    "pillow>=11.0.0",
    "pytesseract>=0.3.13",
    "celery>=5.3.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "bandit>=1.7.9",
    "pip-audit>=2.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E401",
    "E402",
    "E701",
    "E702",
    "E711",
    "E712",
    "E722",
    "E731",
    "E741",
    "W291",
    "W292",
    "W293",
    "W391",
    "F401",
    "F403",
    "F405",
    "F541",
    "F811",
    "F821",
    "F841",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = false
follow_imports = "silent"
disable_error_code = [
    "import-untyped",
    "attr-defined",
    "name-defined",
    "type-arg",
    "call-arg",
    "union-attr",
    "arg-type",
    "var-annotated",
    "misc",
    "assignment",
    "index",
    "operator",
    "return-value",
    "valid-type",
    "dict-item",
    "override",
    "list-item",
    "func-returns-value",
    "abstract",
    "annotation-unchecked",
    "type-var",
    "has-type",
    "no-redef",
    "truthy-bool"
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

