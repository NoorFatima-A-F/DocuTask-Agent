# Render blueprint: API (web), Celery worker, Postgres, Redis.
#
# Uploaded files go to an S3-compatible bucket (STORAGE_BACKEND=s3) because Render services do
# not share a disk: the worker must read what the web service stored. Create the bucket first
# (AWS S3, Cloudflare R2, ...) and fill in the S3_* and AWS_* values in the dashboard.

envVarGroups:
  - name: docutask-shared
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL # leave empty for AWS S3; set for R2/MinIO/B2
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

services:
  - type: web
    name: docutask-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    plan: starter
    envVars:
      - fromGroup: docutask-shared
      - key: DATABASE_URL
        fromDatabase:
          name: docutask-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: docutask-redis
          property: connectionString

  - type: worker
    name: docutask-worker
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: celery -A app.jobs.celery_app worker --loglevel=info --concurrency=2
    plan: starter
    envVars:
      - fromGroup: docutask-shared
      - key: DATABASE_URL
        fromDatabase:
          name: docutask-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: docutask-redis
          property: connectionString

  - type: redis
    name: docutask-redis
    plan: starter
    maxmemoryPolicy: noeviction # queued jobs must never be evicted
    ipAllowList: []

databases:
  - name: docutask-db
    plan: basic-256mb
