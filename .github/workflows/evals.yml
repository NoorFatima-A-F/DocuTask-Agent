name: Agent Evaluation Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/agents/**'
      - 'app/services/**'
      - 'evals/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evals:
    name: Deterministic Golden Benchmark Evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,evals]" || pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Deterministic Golden Benchmark
        env:
          PYTHONPATH: .
        run: python -m evals.harness --golden-dataset evals/data/golden_v1.jsonl --threshold 0.90
