name: Enterprise Audit Authority & Meta-Assurance Gate

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  meta-assurance-gate:
    name: Meta-Assurance & Independent Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov cryptography pydantic

      - name: 1. Engine Self-Integrity Verification
        run: |
          python -m enterprise_audit_engine.cli.main run-trust-assurance --repo-root .

      - name: 2. Execute 50+ Adversarial Mutation Attacks
        run: |
          python -m enterprise_audit_engine.cli.main run-expanded-mutations

      - name: 3. Deterministic Twin Audit Reproducibility Challenge
        run: |
          python -m enterprise_audit_engine.cli.main reproduce-test --repo-root .

      - name: 4. Full Enterprise Certification & Transparency Append
        run: |
          python -m enterprise_audit_engine.cli.main enterprise-certify-full --repo-root . --policy enterprise_grade

      - name: 5. Verify Cryptographic Transparency Log Integrity
        run: |
          python -m enterprise_audit_engine.cli.main verify-transparency-log --repo-root .

      - name: 6. Standalone Zero-Dependency External Verifier Gate
        run: |
          python -m enterprise_audit_engine.external_verifier.cli --certificate release_audit/verification_certificate.json --public-key release_audit/public_key.pem --merkle-manifest release_audit/audit_merkle_root.json

      - name: 7. Run Meta-Assurance Test Suite (150+ Tests)
        run: |
          pytest enterprise_audit_engine/tests/ -v --cov=enterprise_audit_engine --cov-report=term-missing

      - name: Upload Certification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-certification-bundle
          path: |
            release_audit/
            audit_output/
