name: Enterprise Verification CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  static-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Shared Kernel Invariants
        run: python tooling/governance/shared_kernel_validator.py
      - name: Validate Repository Architecture Topology
        run: python tooling/governance/repository_validator.py
      - name: Validate Documentation As Code
        run: python tooling/governance/documentation_validator.py

  test-pyramid:
    needs: static-governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: pip install -e .[test]
      - name: Run Full Platform Verification Test Suite
        run: pytest tests/platform_verification/ -v --cov=app --cov-report=term-missing
