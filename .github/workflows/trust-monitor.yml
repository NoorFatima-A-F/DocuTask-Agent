name: Continuous Trust Monitoring & Reality Verification Pipeline

on:
  schedule:
    # Run daily at midnight UTC for drift, validity, and freshness
    - cron: '0 0 * * *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  reality-trust-monitor:
    name: Continuous Trust & Reality Verification Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov cryptography pydantic

      - name: 1. Execute External Reality Validators (API, DB, Security Probes)
        run: |
          python -m enterprise_audit_engine.cli.main validate-reality --repo-root .

      - name: 2. Check for Certification Contradictions
        run: |
          python -m enterprise_audit_engine.cli.main detect-contradictions --repo-root .

      - name: 3. Run Auditor Simulation Consensus
        run: |
          python -m enterprise_audit_engine.cli.main simulate-auditors --repo-root .

      - name: 4. Execute 250+ Adversarial Mutation Attacks
        run: |
          python -m enterprise_audit_engine.cli.main run-250-mutations

      - name: 5. Detect Code, Dependency & Infrastructure Drift
        run: |
          python -m enterprise_audit_engine.cli.main detect-drift --repo-root .

      - name: 6. Run External Calibration Benchmarks
        run: |
          python -m enterprise_audit_engine.cli.main run-benchmarks

      - name: 7. Run 300+ Automated Tests Suite
        run: |
          pytest enterprise_audit_engine/tests/ -v --cov=enterprise_audit_engine --cov-report=term-missing

      - name: 8. Export Auditor Review Package v2
        run: |
          python -m enterprise_audit_engine.cli.main export-auditor-package-v2 --output-dir external_review_package_v2

      - name: Upload Review Package v2 Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-auditor-package-v2
          path: external_review_package_v2/
