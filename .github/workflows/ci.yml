name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Code Quality & Static Typing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit pytest pytest-asyncio pytest-cov
          pip install -r requirements.txt

      - name: Run Ruff Linting
        run: ruff check app/ tests/ enterprise_audit_engine/

      - name: Run MyPy Type Checking
        run: mypy app/ enterprise_audit_engine/ --ignore-missing-imports

      - name: Run Bandit AST Security Scan
        run: bandit -r app/ enterprise_audit_engine/ -ll -q

  test-suite:
    name: Automated Tests & Coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Execute Pytest Suite
        env:
          APP_ENV: test
          DEBUG: "false"
        run: |
          pytest tests/ enterprise_audit_engine/tests/ -v --cov=app --cov=enterprise_audit_engine --cov-report=xml --cov-report=term-missing

      - name: Upload Test Coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-py312
          path: coverage.xml
          if-no-files-found: ignore
