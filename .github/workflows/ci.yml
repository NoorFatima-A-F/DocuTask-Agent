name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-types:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e ".[dev]" || pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff Linter & Formatter
        env:
          PYTHONPATH: .
        run: |
          ruff check app/ tests/
          ruff format --check app/ tests/

      - name: Static Type Check
        env:
          PYTHONPATH: .
        run: mypy app/ tests/ --ignore-missing-imports

  unit-and-integration:
    name: Pytest Suite with Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest Suite with Coverage
        env:
          APP_ENV: test
          DEBUG: "false"
          PYTHONPATH: .
        run: |
          pytest tests/ -v --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=80 --ignore=tests/world --ignore=tests/world_model --ignore=tests/platform_verification

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
