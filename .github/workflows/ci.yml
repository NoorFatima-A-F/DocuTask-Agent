name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Code Quality (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting & Typing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff Linting
        env:
          PYTHONPATH: .
        run: ruff check .

      - name: Run Ruff Formatting Check
        run: ruff format --check .

      - name: Run MyPy Static Type Check
        env:
          PYTHONPATH: .
        run: mypy app/ --ignore-missing-imports

      - name: Run Bandit AST Security Scan
        env:
          PYTHONPATH: .
        run: bandit -r app/ -ll -q

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Runtime & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Pytest Suite with Coverage
        env:
          APP_ENV: test
          DEBUG: "false"
          PYTHONPATH: .
        run: |
          pytest tests/ --ignore=tests/world --ignore=tests/world_model --ignore=tests/platform_verification -v --import-mode=importlib --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload Test Coverage Artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py312
          path: coverage.xml
          if-no-files-found: ignore
