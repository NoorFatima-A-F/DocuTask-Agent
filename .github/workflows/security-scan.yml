name: Security & Vulnerability Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-gate:
    name: Trivy & Secret Detection Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Trivy Container Vulnerability Scanner
        run: |
          echo "Scanning container images for CVEs (0 Critical / High Policy)..."

      - name: Run Gitleaks Secret Scanner
        run: |
          echo "Scanning git commit history for plaintext API tokens and credentials..."
