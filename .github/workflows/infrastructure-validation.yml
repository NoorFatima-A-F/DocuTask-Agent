name: Infrastructure Continuous Verification

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docker-compose*.yml'
      - 'Dockerfile*'
      - 'requirements*.txt'
      - 'app/platform_verification/**'
  pull_request:
    branches: [ main ]

jobs:
  validate-infrastructure:
    name: Run Continuous Infrastructure Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Execute Phase 3Q Continuous Verification Pipeline
        run: |
          python run_enterprise_continuous_verification.py

      - name: Upload Pipeline Verification Evidence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence-bundle
          path: pipeline_evidence/
