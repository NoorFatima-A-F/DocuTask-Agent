      // --- Magic Byte Sniffing ---
      async function validateFile(file) {
        if (file.size > 15 * 1024 * 1024) {
          return { isValid: false, error: `Payload exceeds 15 MB boundary (${(file.size / (1024 * 1024)).toFixed(2)} MB). Rejected at client perimeter.` };
        }
        if (file.size === 0) return { isValid: false, error: 'Cannot process empty document.' };

        try {
          const slice = file.slice(0, 16);
          const buf = await slice.arrayBuffer();
          const bytes = new Uint8Array(buf);
          let mime = 'unknown';
          if (bytes[0] === 0x25 && bytes[1] === 0x50 && bytes[2] === 0x44 && bytes[3] === 0x46) mime = 'application/pdf';
          else if (bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47) mime = 'image/png';
          else if (bytes[0] === 0xFF && bytes[1] === 0xD8 && bytes[2] === 0xFF) mime = 'image/jpeg';
          else if ((bytes[0] === 0x49 && bytes[1] === 0x49) || (bytes[0] === 0x4D && bytes[1] === 0x4D)) mime = 'image/tiff';

          if (mime === 'unknown') {
            return { isValid: false, error: 'Invalid file signature. File header does not match PDF, TIFF, PNG, or JPEG.' };
          }
          return {
            isValid: true,
            mime: mime,
            sizeFormatted: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
            sizeBytes: file.size
          };
        } catch(e) {
          return { isValid: false, error: 'Header inspection exception.' };
        }
      }

      function renderNavItem(id, label, icon, badge) {
        const isActive = state.activeTab === id;
        return `
          <button data-tab="${id}" class="nav-btn w-full text-left px-2.5 py-2 rounded-lg border text-xs font-medium transition-colors flex items-center justify-between cursor-pointer focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none ${
            isActive
              ? 'bg-zinc-800 border-zinc-700 text-zinc-100 shadow-sm'
              : 'bg-transparent border-transparent hover:bg-zinc-800/50 hover:text-zinc-200 text-zinc-400'
          }">
            <div class="flex items-center gap-2.5">
              <span class="${isActive ? 'text-zinc-100' : 'text-zinc-400'}">${icon}</span>
              <span>${label}</span>
            </div>
            ${badge ? `<span class="text-[10px] font-mono px-1.5 py-0.2 rounded border ${isActive ? 'bg-zinc-900 text-zinc-200 border-zinc-700' : 'bg-zinc-900/50 text-zinc-400 border-zinc-800'}">${badge}</span>` : ''}
          </button>
        `;
      }

      function renderScreen() {
        if (state.activeTab === 'ingestion') return renderIngestion();
        if (state.activeTab === 'pipeline') return renderPipeline();
        if (state.activeTab === 'reviewer') return renderReviewer();
        if (state.activeTab === 'observability') return renderObservability();
        return '';
      }

      // --- Helper: Render Semantic Status Badge ---
      function renderStatusBadge(status, reason) {
        const s = (status || '').toUpperCase();
        if (s === 'COMPLETED') {
          return `
            <span class="inline-flex items-center gap-1.5 rounded-md bg-emerald-500/10 px-2 py-1 text-xs font-medium text-emerald-400 border border-emerald-500/20">
              ${ICONS.check} Completed
            </span>
          `;
        }
        if (s === 'TAX_ANOMALY' || (reason && reason.toLowerCase().includes('tax'))) {
          return `
            <div class="flex flex-col">
              <span class="inline-flex items-center gap-1 rounded-md bg-amber-500/10 px-2 py-0.5 text-xs font-medium text-amber-400 border border-amber-500/20 w-fit">
                ${ICONS.alertTriangle} Tax Discrepancy
              </span>
              <span class="mt-0.5 text-[11px] text-zinc-400 font-sans">${reason || 'Calculated tax variance (68% vs 85% expected)'}</span>
            </div>
          `;
        }
        if (s === 'LOW_CONFIDENCE' || s === 'REVIEW_REQ' || (reason && reason.toLowerCase().includes('confidence'))) {
          return `
            <div class="flex flex-col">
              <span class="inline-flex items-center gap-1 rounded-md bg-amber-500/10 px-2 py-0.5 text-xs font-medium text-amber-400 border border-amber-500/20 w-fit">
                ${ICONS.shieldAlert} Needs Review
              </span>
              <span class="mt-0.5 text-[11px] text-zinc-400 font-sans">${reason || 'Model confidence (72.4%) below 75% threshold'}</span>
            </div>
          `;
        }
        return `
          <span class="inline-flex items-center gap-1 rounded-md bg-zinc-800 px-2 py-1 text-xs font-medium text-zinc-300 border border-zinc-700">
            ${status}
          </span>
        `;
      }

                  <!-- Queue Priority Policy -->

                    <div role="radiogroup" aria-label="Queue Priority" class="grid grid-cols-3 gap-2">
                      ${[
                        { id: 'P0', label: 'P0 — Critical', desc: 'Realtime SLA (<1s)' },

                        { id: 'P2', label: 'P2 — Batch', desc: 'Background Idle' },
                      ].map(p => {

                              ? 'border-indigo-500/80 bg-indigo-500/10 text-indigo-300 ring-1 ring-indigo-500/50 shadow-sm font-medium'

                    </div>
                  </div>
                </div>

                <!-- Dispatch Ingestion CTA -->
                <div class="pt-2">
                  <button id="btn-dispatch" ${!state.selectedFile || state.isUploading ? 'disabled' : ''} class="mt-4 flex w-full items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition-all hover:bg-indigo-500 disabled:cursor-not-allowed disabled:bg-zinc-800 disabled:text-zinc-500 cursor-pointer focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none">
                    ${state.isUploading ? `
                      ${ICONS.loader2}
                      <span>Routing to Pipeline (${state.uploadProgress}%)...</span>
                    ` : `
                      <span>Dispatch Ingestion</span>
                      ${ICONS.arrowRight}
                    `}
                  </button>
                </div>
              </div>

              <!-- Right Column: Document Preview / Extraction Inspector (7 cols) -->
              <div class="lg:col-span-7 flex flex-col h-full min-h-[420px]">
                ${state.selectedTaskPreview ? `
                  <div class="flex h-full flex-col justify-between rounded-xl border border-zinc-800 bg-zinc-900/60 p-5 shadow-sm space-y-4">
                    <div class="space-y-4">
                      <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                        <div class="flex items-center gap-2">
                          <span class="text-emerald-400">${ICONS.check}</span>
                          <h3 class="text-xs font-semibold uppercase tracking-wider text-zinc-200 font-mono">Task Inspector Preview</h3>

                        <span class="font-mono text-xs text-zinc-400">${state.selectedTaskPreview.taskId}</span>

                      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div class="rounded-lg border border-zinc-800 bg-zinc-900/80 p-3">
                          <span class="text-[10px] uppercase font-mono text-zinc-400 block">File Name</span>
                          <span class="text-xs font-semibold text-zinc-100 truncate block mt-0.5" title="${state.selectedTaskPreview.filename}">${state.selectedTaskPreview.filename}</span>
                        </div>
                        <div class="rounded-lg border border-zinc-800 bg-zinc-900/80 p-3">
                          <span class="text-[10px] uppercase font-mono text-zinc-400 block">Schema</span>
                          <span class="text-xs font-semibold text-zinc-100 block mt-0.5">${SCHEMA_CONFIG[state.selectedTaskPreview.schemaType]?.label || state.selectedTaskPreview.schemaType}</span>
                        </div>
                        <div class="rounded-lg border border-zinc-800 bg-zinc-900/80 p-3">
                          <span class="text-[10px] uppercase font-mono text-zinc-400 block">Confidence</span>

                    <div class="pt-4 flex items-center justify-between border-t border-zinc-800">
                      <button id="btn-clear-preview" class="px-3 py-1.5 rounded-lg border border-zinc-800 bg-zinc-900 text-xs text-zinc-400 hover:text-zinc-200 transition-colors cursor-pointer focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none">

                        ${ICONS.eye}

                ` : `

                    <div class="rounded-full bg-zinc-800/60 p-4 text-zinc-400 mb-3">

                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>

                  <span class="rounded bg-zinc-800/80 px-1.5 py-0.5 text-[10px] font-medium text-zinc-400 border border-zinc-700/60">

                  </span>
                </div>

                <div class="flex flex-wrap items-center gap-3">

                    <option value="ALL" ${state.statusFilter === 'ALL' ? 'selected' : ''}>All Statuses</option>
                    <option value="ANOMALIES" ${state.statusFilter === 'ANOMALIES' ? 'selected' : ''}>Anomalies &amp; Review</option>
                    <option value="COMPLETED" ${state.statusFilter === 'COMPLETED' ? 'selected' : ''}>Completed</option>
                  </select>

                  <button id="btn-toggle-live" class="flex items-center gap-1.5 rounded-lg border border-zinc-800 bg-zinc-900 px-2.5 py-1.5 text-xs text-zinc-300 hover:bg-zinc-800 transition-colors cursor-pointer focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none">
                    <span class="${state.isLive ? 'text-emerald-400' : 'text-zinc-500'}">${ICONS.rotateCcw}</span>

      // --- 2. Pipeline Screen ---
      function renderPipeline() {
        const milestones = [
          { title: 'File Ingestion & Checksum', engine: 'Storage Gateway', desc: 'SHA-256 integrity check and duplicate binary gate validated', latency: '120ms' },
          { title: 'OCR & Layout Parsing', engine: 'OCR Core Engine', desc: 'PyMuPDF rasterization and Tesseract character layout stream', latency: '205ms' },
          { title: 'Schema Contract Selection', engine: 'Schema Invariant Engine', desc: 'Taxonomy matching and target JSON boundary binding', latency: '95ms' },
          { title: 'Multimodal Entity Reasoning', engine: 'Multimodal Core v1.5', desc: 'Structured entity distillation with contextual grounding', latency: '140ms' },
          { title: 'Confidence & Validation Gates', engine: 'Multi-Signal Auditor', desc: 'Evidence scoring, arithmetic reconciliation and HITL thresholding', latency: '80ms' },

      // --- Event Binding ---
      function bindEvents() {
        // Nav tabs
        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            state.activeTab = btn.getAttribute('data-tab');
            render();
          });
        });

        // Spotlight trigger & shortcut
        const btnSpotlight = document.getElementById('btn-spotlight');
        if (btnSpotlight) {
          btnSpotlight.addEventListener('click', () => {
            state.isSpotlightOpen = true;
            render();
          });
        }

        const btnCloseSpotlight = document.getElementById('btn-close-spotlight');
        if (btnCloseSpotlight) {
          btnCloseSpotlight.addEventListener('click', () => {
            state.isSpotlightOpen = false;
            render();
          });
        }

        document.querySelectorAll('.spotlight-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const target = btn.getAttribute('data-jump');
            state.activeTab = target;
            state.isSpotlightOpen = false;
            render();
          });
        });

        // Dropzone & File Input
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        if (dropzone && fileInput) {
          dropzone.addEventListener('click', () => fileInput.click());
          dropzone.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              fileInput.click();
            }
          });
          dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('border-indigo-500', 'bg-indigo-500/5');
          });
          dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('border-indigo-500', 'bg-indigo-500/5');
          });
          dropzone.addEventListener('drop', async (e) => {
            e.preventDefault();
            dropzone.classList.remove('border-indigo-500', 'bg-indigo-500/5');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
              const f = e.dataTransfer.files[0];
              state.selectedFile = f;
              state.validationResult = await validateFile(f);
              render();
            }
          });
          fileInput.addEventListener('change', async (e) => {
            if (e.target.files && e.target.files[0]) {
              const f = e.target.files[0];
              state.selectedFile = f;
              state.validationResult = await validateFile(f);
              render();
            }
          });
        }

        // Clear staged file
        const btnClearFile = document.getElementById('btn-clear-file');
        if (btnClearFile) {
          btnClearFile.addEventListener('click', (e) => {
            e.stopPropagation();
            state.selectedFile = null;
            state.validationResult = null;
            render();
          });
        }

        // Priority Radio Buttons
        document.querySelectorAll('.btn-priority').forEach(btn => {
          btn.addEventListener('click', () => {
            state.priority = btn.getAttribute('data-priority');
            render();
          });
        });

        // Schema Select
        const schemaSelect = document.getElementById('schema-select');
        if (schemaSelect) {
          schemaSelect.addEventListener('change', (e) => {
            state.schemaType = e.target.value;
            render();
          });
        }

        // Clear Preview
        const btnClearPreview = document.getElementById('btn-clear-preview');
        if (btnClearPreview) {
          btnClearPreview.addEventListener('click', () => {
            state.selectedTaskPreview = null;
            render();
          });
        }

        // Stream Search & Filter & Toggle
        const streamSearch = document.getElementById('stream-search');
        if (streamSearch) {
          streamSearch.addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            // update table body directly without full rerender to maintain input focus
            const tbody = document.querySelector('tbody');
            if (tbody) {
              const filtered = state.queue.filter(row => {
                const matchSearch = row.taskId.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
                  row.filename.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
                  row.schemaType.toLowerCase().includes(state.searchQuery.toLowerCase());
                if (!matchSearch) return false;
                if (state.statusFilter === 'ALL') return true;
                if (state.statusFilter === 'ANOMALIES') return row.status !== 'COMPLETED';
                if (state.statusFilter === 'COMPLETED') return row.status === 'COMPLETED';
                return true;
              });
              tbody.innerHTML = filtered.map(row => `
                <tr data-doc-id="${row.documentId}" data-task-id="${row.taskId}" class="table-row-item hover:bg-zinc-800/40 cursor-pointer transition-colors">
                  <td class="py-3.5 px-4 font-mono font-semibold text-zinc-200">${row.taskId}</td>
                  <td class="py-3.5 px-4">
                    <div class="flex flex-col">
                      <span class="font-medium text-zinc-100">${row.filename}</span>
                      <span class="text-[11px] text-zinc-400 font-sans">${SCHEMA_CONFIG[row.schemaType]?.label || row.schemaType}</span>
                    </div>
                  </td>
                  <td class="py-3.5 px-3 text-center">
                    <span class="rounded bg-zinc-800 px-2 py-0.5 text-[11px] font-mono font-medium text-zinc-300 border border-zinc-700/60">${row.priority}</span>
                  </td>
                  <td class="py-3.5 px-4">
                    <div class="flex items-center gap-2.5">
                      <span class="font-mono text-xs tabular-nums text-zinc-200 font-medium">${row.confidence.toFixed(1)}%</span>
                      <div class="h-1.5 w-14 rounded-full bg-zinc-800 overflow-hidden shrink-0">
                        <div class="h-full ${row.confidence >= 90 ? 'bg-emerald-500' : row.confidence >= 75 ? 'bg-amber-500' : 'bg-rose-500'}" style="width: ${row.confidence}%"></div>
                      </div>
                    </div>
                  </td>
                  <td class="py-3.5 px-3 text-right font-mono tabular-nums text-zinc-300 font-medium">${row.latencyMs}ms</td>
                  <td class="py-3.5 px-4">${renderStatusBadge(row.status, row.reviewReason)}</td>
                  <td class="py-3.5 px-4 text-right">
                    <button data-doc-id="${row.documentId}" class="btn-inspect inline-flex items-center gap-1.5 rounded-md border border-zinc-700/60 bg-zinc-800/60 px-2.5 py-1 text-xs font-medium text-zinc-200 transition-colors hover:border-zinc-600 hover:bg-zinc-700/70 hover:text-white cursor-pointer focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none">
                      ${ICONS.eye}
                      <span>Inspect</span>
                    </button>
                  </td>
                </tr>
              `).join('');
              bindTableInspectEvents();
            }
          });
        }

        const streamFilter = document.getElementById('stream-filter');
        if (streamFilter) {
          streamFilter.addEventListener('change', (e) => {
            state.statusFilter = e.target.value;
            render();
          });
        }

        const btnToggleLive = document.getElementById('btn-toggle-live');
        if (btnToggleLive) {
          btnToggleLive.addEventListener('click', () => {
            state.isLive = !state.isLive;
            render();
          });
        }

        // Dispatch CTA
        const btnDispatch = document.getElementById('btn-dispatch');
        if (btnDispatch) {
          btnDispatch.addEventListener('click', async () => {
            state.isUploading = true;
            state.uploadProgress = 40;
            render();

            setTimeout(() => { state.uploadProgress = 80; render(); }, 200);
            setTimeout(() => {
              state.uploadProgress = 100;
              state.isUploading = false;
              const newTaskId = 'task_' + Math.random().toString(36).substring(2, 9);
              const newDocId = 'doc_' + Math.random().toString(36).substring(2, 9);
              state.activeJobId = newTaskId;
              state.activeDocId = newDocId;
              const newRow = {
                taskId: newTaskId,
                documentId: newDocId,
                filename: state.selectedFile ? state.selectedFile.name : 'document.pdf',
                schemaType: state.schemaType,
                priority: state.priority,
                confidence: 94.2,
                latencyMs: 640,
                status: 'TAX_ANOMALY',
                reviewReason: 'Calculated tax variance (68% vs 85% expected)'
              };
              state.queue.unshift(newRow);
              state.selectedTaskPreview = newRow;
              showToast('success', 'Document Enqueued', `Job ${newTaskId} dispatched to pipeline.`);
              state.activeTab = 'pipeline';
              render();
            }, 500);
          });
        }

        function bindTableInspectEvents() {
          document.querySelectorAll('.table-row-item').forEach(el => {
            el.addEventListener('click', () => {
              const taskId = el.getAttribute('data-task-id');
              const found = state.queue.find(q => q.taskId === taskId);
              if (found) {
                state.selectedTaskPreview = found;
                render();
              }
            });
          });

          document.querySelectorAll('.btn-inspect').forEach(el => {
            el.addEventListener('click', (e) => {
              e.stopPropagation();
              const docId = el.getAttribute('data-doc-id') || el.closest('tr')?.getAttribute('data-doc-id');
              if (docId) {
                state.activeDocId = docId;
                state.activeTab = 'reviewer';
                showToast('info', 'HITL Workspace Loaded', `Reviewing document ${docId}`);
                render();
              }
            });
          });
        }

        bindTableInspectEvents();

        // Back to Ingestion Button
        const btnBackIngestion = document.getElementById('btn-back-ingestion');
        if (btnBackIngestion) {
          btnBackIngestion.addEventListener('click', () => {
            state.activeTab = 'ingestion';
            render();
          });
        }

        // Pipeline to review
        const btnGotoReview = document.getElementById('btn-goto-review');
        if (btnGotoReview) {
          btnGotoReview.addEventListener('click', () => {
            state.activeTab = 'reviewer';
            render();
          });
        }

        // Time-Range buttons
        document.querySelectorAll('.btn-timerange').forEach(btn => {
          btn.addEventListener('click', () => {
            state.timeRange = btn.getAttribute('data-range');
            render();
          });
        });

        // DLQ Seed & Refresh
        const btnSeedFailure = document.getElementById('btn-seed-failure');
        if (btnSeedFailure) {
          btnSeedFailure.addEventListener('click', () => {
            state.dlqItems = [{
              id: 'dlq_88a91b',
              job_id: 'job_ocr_fail_091',
              document_id: 'doc_corrupted_scan_8',
              error_classification: 'TIMEOUT_OCR_RASTER',
              error_message: 'PyMuPDF rasterization limit exceeded on 600DPI TIFF page 4',
              stack_trace: 'Traceback (most recent call last):\n  File "app/jobs/worker.py", line 84, in execute_pipeline\n  File "app/services/ocr_service.py", line 42, in parse_layout\nRuntimeError: OCR parsing failed on corrupted raster stream',
              retry_count: 3,
              max_retries: 3,
              enqueued_at: new Date().toISOString()
            }];
            showToast('info', 'Diagnostic Failure Seeded', 'Simulated corrupted raster exception added to DLQ.');
            render();
          });
        }

        const btnRefreshDlq = document.getElementById('btn-refresh-dlq');
        if (btnRefreshDlq) {
          btnRefreshDlq.addEventListener('click', () => {
            showToast('info', 'Queue Refreshed', 'Dead letter storage scanned.');
            render();
          });
        }

        // DLQ Inspect & Replay
        document.querySelectorAll('.btn-inspect-trace').forEach(btn => {
          btn.addEventListener('click', () => {
            const traceId = btn.getAttribute('data-trace-id');
            const item = state.dlqItems.find(i => i.id === traceId);
            state.selectedTraceItem = item || null;
            render();
          });
        });

        const btnCloseModal = document.getElementById('btn-close-modal');
        if (btnCloseModal) btnCloseModal.addEventListener('click', () => { state.selectedTraceItem = null; render(); });
        const btnCloseModal2 = document.getElementById('btn-close-modal-2');
        if (btnCloseModal2) btnCloseModal2.addEventListener('click', () => { state.selectedTraceItem = null; render(); });

        const btnCopyTrace = document.getElementById('btn-copy-trace');
        if (btnCopyTrace) {
          btnCopyTrace.addEventListener('click', () => {
            if (state.selectedTraceItem?.stack_trace) {
              navigator.clipboard.writeText(state.selectedTraceItem.stack_trace);
              showToast('success', 'Trace Copied', 'Python traceback copied to clipboard.');
            }
          });
        }

        document.querySelectorAll('.btn-replay-item').forEach(btn => {
          btn.addEventListener('click', () => {
            const jobId = btn.getAttribute('data-replay-job');
            state.dlqItems = state.dlqItems.filter(i => i.job_id !== jobId);
            state.selectedTraceItem = null;
            showToast('success', 'Task Replayed', `Job ${jobId} re-enqueued for worker execution.`);
            render();
          });
        });

        // Reviewer Zoom/Rotate controls
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const btnFit = document.getElementById('btn-fit');
        const btnRotate = document.getElementById('btn-rotate');
        if (btnZoomIn) btnZoomIn.addEventListener('click', () => { state.zoom = Math.min(200, state.zoom + 25); render(); });
        if (btnZoomOut) btnZoomOut.addEventListener('click', () => { state.zoom = Math.max(50, state.zoom - 25); render(); });
        if (btnFit) btnFit.addEventListener('click', () => { state.zoom = 100; render(); });
        if (btnRotate) btnRotate.addEventListener('click', () => { state.rotation = (state.rotation + 90) % 360; render(); });

        // Synchronized Hover & Focus Listeners (Canvas Bounding Box <-> Schema Field)
        document.querySelectorAll('.field-box').forEach(box => {
          const key = box.getAttribute('data-field-box');
          box.addEventListener('mouseenter', () => {
            state.hoveredFieldKey = key;
            const container = document.querySelector(`[data-field-container="${key}"]`);
            if (container) container.classList.add('ring-1', 'ring-zinc-400', 'bg-zinc-800/60');
          });
          box.addEventListener('mouseleave', () => {
            state.hoveredFieldKey = null;
            const container = document.querySelector(`[data-field-container="${key}"]`);
            if (container) container.classList.remove('ring-1', 'ring-zinc-400', 'bg-zinc-800/60');
          });
          box.addEventListener('focus', () => {
            state.hoveredFieldKey = key;
            const container = document.querySelector(`[data-field-container="${key}"]`);
            if (container) container.classList.add('ring-1', 'ring-zinc-400', 'bg-zinc-800/60');
          });
          box.addEventListener('blur', () => {
            state.hoveredFieldKey = null;
            const container = document.querySelector(`[data-field-container="${key}"]`);
            if (container) container.classList.remove('ring-1', 'ring-zinc-400', 'bg-zinc-800/60');
          });
        });

        document.querySelectorAll('.field-container').forEach(container => {
          const key = container.getAttribute('data-field-container');
          container.addEventListener('mouseenter', () => {
            const box = document.querySelector(`[data-field-box="${key}"]`);
            if (box) box.classList.add('ring-2', 'ring-white', 'z-20', 'shadow-lg');
          });
          container.addEventListener('mouseleave', () => {
            const box = document.querySelector(`[data-field-box="${key}"]`);
            if (box) box.classList.remove('ring-2', 'ring-white', 'z-20', 'shadow-lg');
          });
        });

        // Input Field Change
        document.querySelectorAll('.field-input').forEach(input => {
          input.addEventListener('input', (e) => {
            const key = e.target.getAttribute('data-key');
            const field = state.fields.find(f => f.key === key);
            if (field) {
              field.value = e.target.value;
              field.confidence = 1.0;
            }
          });
        });

        // Approve & Reject
        const btnReject = document.getElementById('btn-reject');
        if (btnReject) {
          btnReject.addEventListener('click', () => {
            state.dlqItems.unshift({
              id: 'dlq_' + Math.random().toString(36).substring(2, 8),
              job_id: state.activeJobId,
              document_id: state.activeDocId,
              error_classification: 'OPERATOR_REJECTED',
              error_message: 'Rejected during Human-in-the-Loop review by lead.operator',
              stack_trace: 'HITL Reviewer Quarantine: Operator rejected extracted entities due to tax validation mismatch.',
              retry_count: 0,
              max_retries: 3,
              enqueued_at: new Date().toISOString()
            });
            showToast('error', 'Batch Quarantined', `Document ${state.activeDocId} moved to DLQ.`);
            state.activeTab = 'observability';
            render();
          });
        }

        const btnApprove = document.getElementById('btn-approve');
        if (btnApprove) {
          btnApprove.addEventListener('click', async () => {
            state.isApproving = true;
            render();
            await fetch('/api/v1/runtime/feedback', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                document_id: state.activeDocId,
                field_name: 'tax_amount',
                original_value: '870.38',
                corrected_value: '870.38',
                distillation_type: 'RULE',
                operator_notes: 'Operator confirmed tax rule'
              })
            }).catch(() => {});
            state.isApproving = false;
            state.isApproved = true;
            showToast('success', 'Schema Persisted', `Feedback calibrated and saved for ${state.activeDocId}.`);
            render();
            setTimeout(() => {
              state.activeTab = 'observability';
              render();
            }, 800);
          });
        }
      }

      // Global keyboard listener for Cmd+K / Ctrl+K
      window.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault();
          state.isSpotlightOpen = !state.isSpotlightOpen;
          render();
        } else if (e.key === 'Escape' && state.isSpotlightOpen) {
          state.isSpotlightOpen = false;
          render();
        }
      });

      window.probeBackendHealth = probeBackendHealth;

      document.addEventListener('DOMContentLoaded', render);
      if (document.readyState === 'complete' || document.readyState === 'interactive') render();
    })();
  </script>
</body>
</html>
