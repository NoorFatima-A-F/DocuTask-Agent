      // --- Magic Byte Sniffing ---
      async function validateFile(file) {
        if (file.size > 15 * 1024 * 1024) {
          return { isValid: false, error: `Payload exceeds 15 MB boundary (${(file.size / (1024 * 1024)).toFixed(2)} MB). Rejected at client perimeter.` };
        }
        if (file.size === 0) return { isValid: false, error: 'Cannot process empty document.' };

        try {
          const slice = file.slice(0, 16);
          const buf = await slice.arrayBuffer();
          const bytes = new Uint8Array(buf);
          let mime = 'unknown';
          if (bytes[0] === 0x25 && bytes[1] === 0x50 && bytes[2] === 0x44 && bytes[3] === 0x46) mime = 'application/pdf';
          else if (bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47) mime = 'image/png';
          else if (bytes[0] === 0xFF && bytes[1] === 0xD8 && bytes[2] === 0xFF) mime = 'image/jpeg';
          else if ((bytes[0] === 0x49 && bytes[1] === 0x49) || (bytes[0] === 0x4D && bytes[1] === 0x4D)) mime = 'image/tiff';

          if (mime === 'unknown') {
            return { isValid: false, error: 'Invalid file signature. File header does not match PDF, TIFF, PNG, or JPEG.' };
          }
          return {
            isValid: true,
            mime: mime,
            sizeFormatted: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
            sizeBytes: file.size
          };
        } catch(e) {
          return { isValid: false, error: 'Header inspection exception.' };
        }
      }

                  <div class="text-[10px] text-zinc-400 uppercase">Error Classification</div>

                  <div class="text-zinc-300 text-[11px] pt-1">${item.error_message}</div>
                </div>

                <div class="space-y-1">
                  <div class="flex items-center justify-between text-[10px] text-zinc-400 uppercase">
                    <span>Python Traceback</span>
                    <button id="btn-copy-trace" class="text-zinc-300 hover:text-white inline-flex items-center gap-1 text-[10px] cursor-pointer">
                      ${ICONS.copy} <span>Copy Trace</span>
                    </button>
                  </div>
                  <pre class="p-3 rounded bg-zinc-950 border border-zinc-800 text-rose-300/90 text-[11px] whitespace-pre-wrap overflow-x-auto leading-relaxed">${item.stack_trace}</pre>
                </div>
              </div>

              <div class="border-t border-zinc-800 pt-3 flex items-center justify-between">
                <span class="text-[11px] font-mono text-zinc-400">Retries: ${item.retry_count}/${item.max_retries}</span>
                <div class="flex items-center gap-2">
                  <button id="btn-close-modal-2" class="px-3 py-1.5 rounded bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-zinc-300 text-xs font-mono cursor-pointer">Close</button>
                  <button data-replay-job="${item.job_id}" class="btn-replay-item px-3.5 py-1.5 rounded bg-zinc-100 hover:bg-white text-zinc-950 text-xs font-semibold font-mono inline-flex items-center gap-1.5 shadow-sm cursor-pointer">
                    ${ICONS.rotateCcw}
                    <span>Replay Task Now</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderSpotlightModal() {
        return `
          <div role="dialog" aria-modal="true" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-start justify-center pt-20 p-4">
            <div class="w-full max-w-xl bg-[#121215] border border-zinc-700/80 rounded-xl shadow-2xl overflow-hidden flex flex-col">
              <div class="flex items-center gap-3 px-4 py-3 border-b border-zinc-800">
                ${ICONS.search}
                <input id="spotlight-input" type="text" placeholder="Jump to workspace or run command (e.g. Ingestion, HITL, DLQ)..." class="w-full bg-transparent text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none font-mono" autofocus />
                <kbd id="btn-close-spotlight" class="px-1.5 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-[10px] font-mono text-zinc-400 cursor-pointer">ESC</kbd>
              </div>
              <div class="p-2 space-y-1 max-h-80 overflow-y-auto font-mono text-xs">
                <button data-jump="ingestion" class="spotlight-btn w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-3 text-zinc-300 hover:bg-zinc-800 hover:text-zinc-100 transition-colors cursor-pointer">
                  ${ICONS.uploadCloud}
                  <div>
                    <div class="font-semibold text-zinc-200">Go to Ingestion Studio</div>
                    <div class="text-[10px] text-zinc-400">Upload documents and monitor active dispatch queue</div>
                  </div>
                </button>
                <button data-jump="pipeline" class="spotlight-btn w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-3 text-zinc-300 hover:bg-zinc-800 hover:text-zinc-100 transition-colors cursor-pointer">
                  ${ICONS.workflow}
                  <div>
                    <div class="font-semibold text-zinc-200">Go to Pipeline Monitor</div>
                    <div class="text-[10px] text-zinc-400">Inspect live DAG stages, rasterization, and LLM reasoning</div>
                  </div>
                </button>
                <button data-jump="reviewer" class="spotlight-btn w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-3 text-zinc-300 hover:bg-zinc-800 hover:text-zinc-100 transition-colors cursor-pointer">
                  ${ICONS.checkSquare}
                  <div>
                    <div class="font-semibold text-zinc-200">Go to HITL Reviewer</div>
                    <div class="text-[10px] text-zinc-400">Two-pane PDF canvas with interactive bounding box schema editor</div>
                  </div>
                </button>
                <button data-jump="observability" class="spotlight-btn w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-3 text-zinc-300 hover:bg-zinc-800 hover:text-zinc-100 transition-colors cursor-pointer">
                  ${ICONS.barChart}
                  <div>
                    <div class="font-semibold text-zinc-200">Go to DLQ &amp; Telemetry Hub</div>
                    <div class="text-[10px] text-zinc-400">Worker health, latency P95 charts, and exception recovery</div>
                  </div>
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // --- Event Binding ---
      function bindEvents() {
        // Nav tabs
        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            state.activeTab = btn.getAttribute('data-tab');
            render();
          });
        });

        // Spotlight trigger & shortcut
        const btnSpotlight = document.getElementById('btn-spotlight');
        if (btnSpotlight) {
          btnSpotlight.addEventListener('click', () => {
            state.isSpotlightOpen = true;
            render();
          });
        }

        const btnCloseSpotlight = document.getElementById('btn-close-spotlight');
        if (btnCloseSpotlight) {
          btnCloseSpotlight.addEventListener('click', () => {
            state.isSpotlightOpen = false;
            render();
          });
        }

        document.querySelectorAll('.spotlight-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const target = btn.getAttribute('data-jump');
            state.activeTab = target;
            state.isSpotlightOpen = false;
            render();
          });
        });

        // Dropzone & File Input
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        if (dropzone && fileInput) {
          dropzone.addEventListener('click', () => fileInput.click());
          dropzone.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              fileInput.click();
            }
          });
          fileInput.addEventListener('change', async (e) => {
            if (e.target.files && e.target.files[0]) {
              const f = e.target.files[0];
              state.selectedFile = f;
              state.validationResult = await validateFile(f);
              render();
            }
          });
        }

        // Clear staged file
        const btnClearFile = document.getElementById('btn-clear-file');
        if (btnClearFile) {
          btnClearFile.addEventListener('click', (e) => {
            e.stopPropagation();
            state.selectedFile = null;
            state.validationResult = null;
            render();
          });
        }

        // Priority Buttons
        document.querySelectorAll('.btn-priority').forEach(btn => {
          btn.addEventListener('click', () => {
            state.priority = btn.getAttribute('data-priority');
            render();
          });
        });

        // Schema Select
        const schemaSelect = document.getElementById('schema-select');
        if (schemaSelect) {
          schemaSelect.addEventListener('change', (e) => {
            state.schemaType = e.target.value;
          });
        }

        // Dispatch CTA
        const btnDispatch = document.getElementById('btn-dispatch');
        if (btnDispatch) {
          btnDispatch.addEventListener('click', async () => {
            state.isUploading = true;
            state.uploadProgress = 40;
            render();

            setTimeout(() => { state.uploadProgress = 80; render(); }, 200);
            setTimeout(() => {
              state.uploadProgress = 100;
              state.isUploading = false;
              const newTaskId = 'task_' + Math.random().toString(36).substring(2, 9);
              const newDocId = 'doc_' + Math.random().toString(36).substring(2, 9);
              state.activeJobId = newTaskId;
              state.activeDocId = newDocId;
              state.queue.unshift({
                taskId: newTaskId,
                documentId: newDocId,
                filename: state.selectedFile ? state.selectedFile.name : 'document.pdf',
                schemaType: state.schemaType,
                priority: state.priority,
                confidence: 0.942,
                latencyMs: 640,
                status: 'REVIEW_REQ',
                reviewReason: 'Tax Anomaly (Tax 68% < 85%)'
              });
              showToast('success', 'Document Enqueued', `Job ${newTaskId} enqueued for processing.`);
              state.activeTab = 'pipeline';
              render();
            }, 500);
          });
        }

        // Table Rows & Inspect Buttons
        document.querySelectorAll('.table-row-item, .btn-inspect').forEach(el => {
          el.addEventListener('click', (e) => {
            const docId = el.getAttribute('data-doc-id') || el.closest('tr')?.getAttribute('data-doc-id');
            if (docId) {
              state.activeDocId = docId;
              state.activeTab = 'reviewer';
              showToast('info', 'HITL Workspace Loaded', `Reviewing document ${docId}`);
              render();
            }
          });
        });

        // Back to Ingestion Button
        const btnBackIngestion = document.getElementById('btn-back-ingestion');
        if (btnBackIngestion) {
          btnBackIngestion.addEventListener('click', () => {
            state.activeTab = 'ingestion';
            render();
          });
        }

        // Pipeline to review
        const btnGotoReview = document.getElementById('btn-goto-review');
        if (btnGotoReview) {
          btnGotoReview.addEventListener('click', () => {
            state.activeTab = 'reviewer';
            render();
          });
        }

        // Time-Range buttons
        document.querySelectorAll('.btn-timerange').forEach(btn => {
          btn.addEventListener('click', () => {
            state.timeRange = btn.getAttribute('data-range');
            render();
          });
        });

        // DLQ Seed & Refresh
        const btnSeedFailure = document.getElementById('btn-seed-failure');
        if (btnSeedFailure) {
          btnSeedFailure.addEventListener('click', () => {
            state.dlqItems = [{
              id: 'dlq_88a91b',
              job_id: 'job_ocr_fail_091',
              document_id: 'doc_corrupted_scan_8',
              error_classification: 'TIMEOUT_OCR_RASTER',
              error_message: 'PyMuPDF rasterization limit exceeded on 600DPI TIFF page 4',
              stack_trace: 'Traceback (most recent call last):\n  File "app/jobs/worker.py", line 84, in execute_pipeline\n  File "app/services/ocr_service.py", line 42, in parse_layout\nRuntimeError: OCR parsing failed on corrupted raster stream',
              retry_count: 3,
              max_retries: 3,
              enqueued_at: new Date().toISOString()
            }];
            showToast('info', 'Diagnostic Failure Seeded', 'Simulated corrupted raster exception added to DLQ.');
            render();
          });
        }

        const btnRefreshDlq = document.getElementById('btn-refresh-dlq');
        if (btnRefreshDlq) {
          btnRefreshDlq.addEventListener('click', () => {
            showToast('info', 'Queue Refreshed', 'Dead letter storage scanned.');
            render();
          });
        }

        // DLQ Inspect & Replay
        document.querySelectorAll('.btn-inspect-trace').forEach(btn => {
          btn.addEventListener('click', () => {
            const traceId = btn.getAttribute('data-trace-id');
            const item = state.dlqItems.find(i => i.id === traceId);
            state.selectedTraceItem = item || null;
            render();
          });
        });

        const btnCloseModal = document.getElementById('btn-close-modal');
        if (btnCloseModal) btnCloseModal.addEventListener('click', () => { state.selectedTraceItem = null; render(); });
        const btnCloseModal2 = document.getElementById('btn-close-modal-2');
        if (btnCloseModal2) btnCloseModal2.addEventListener('click', () => { state.selectedTraceItem = null; render(); });

        const btnCopyTrace = document.getElementById('btn-copy-trace');
        if (btnCopyTrace) {
          btnCopyTrace.addEventListener('click', () => {
            if (state.selectedTraceItem?.stack_trace) {
              navigator.clipboard.writeText(state.selectedTraceItem.stack_trace);
              showToast('success', 'Trace Copied', 'Python traceback copied to clipboard.');
            }
          });
        }

        document.querySelectorAll('.btn-replay-item').forEach(btn => {
          btn.addEventListener('click', () => {
            const jobId = btn.getAttribute('data-replay-job');
            state.dlqItems = state.dlqItems.filter(i => i.job_id !== jobId);
            state.selectedTraceItem = null;
            showToast('success', 'Task Replayed', `Job ${jobId} re-enqueued for worker execution.`);
            render();
          });
        });

        // Reviewer Zoom/Rotate controls
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const btnFit = document.getElementById('btn-fit');
        const btnRotate = document.getElementById('btn-rotate');
        if (btnZoomIn) btnZoomIn.addEventListener('click', () => { state.zoom = Math.min(200, state.zoom + 25); render(); });
        if (btnZoomOut) btnZoomOut.addEventListener('click', () => { state.zoom = Math.max(50, state.zoom - 25); render(); });
        if (btnFit) btnFit.addEventListener('click', () => { state.zoom = 100; render(); });
        if (btnRotate) btnRotate.addEventListener('click', () => { state.rotation = (state.rotation + 90) % 360; render(); });

        // Synchronized Hover & Focus Listeners (Canvas Bounding Box <-> Schema Field)
        document.querySelectorAll('.field-box').forEach(box => {
          const key = box.getAttribute('data-field-box');
          box.addEventListener('mouseenter', () => {
            state.hoveredFieldKey = key;
            const container = document.querySelector(`[data-field-container="${key}"]`);
            if (container) container.classList.add('ring-1', 'ring-zinc-400', 'bg-zinc-800/60');
          });
          box.addEventListener('mouseleave', () => {
            state.hoveredFieldKey = null;
            const container = document.querySelector(`[data-field-container="${key}"]`);
            if (container) container.classList.remove('ring-1', 'ring-zinc-400', 'bg-zinc-800/60');
          });
          box.addEventListener('focus', () => {
            state.hoveredFieldKey = key;
            const container = document.querySelector(`[data-field-container="${key}"]`);
            if (container) container.classList.add('ring-1', 'ring-zinc-400', 'bg-zinc-800/60');
          });
          box.addEventListener('blur', () => {
            state.hoveredFieldKey = null;
            const container = document.querySelector(`[data-field-container="${key}"]`);
            if (container) container.classList.remove('ring-1', 'ring-zinc-400', 'bg-zinc-800/60');
          });
        });

        document.querySelectorAll('.field-container').forEach(container => {
          const key = container.getAttribute('data-field-container');
          container.addEventListener('mouseenter', () => {
            const box = document.querySelector(`[data-field-box="${key}"]`);
            if (box) box.classList.add('ring-2', 'ring-white', 'z-20', 'shadow-lg');
          });
          container.addEventListener('mouseleave', () => {
            const box = document.querySelector(`[data-field-box="${key}"]`);
            if (box) box.classList.remove('ring-2', 'ring-white', 'z-20', 'shadow-lg');
          });
        });

        // Input Field Change
        document.querySelectorAll('.field-input').forEach(input => {
          input.addEventListener('input', (e) => {
            const key = e.target.getAttribute('data-key');
            const field = state.fields.find(f => f.key === key);
            if (field) {
              field.value = e.target.value;
              field.confidence = 1.0;
            }
          });
        });

        // Approve & Reject
        const btnReject = document.getElementById('btn-reject');
        if (btnReject) {
          btnReject.addEventListener('click', () => {
            state.dlqItems.unshift({
              id: 'dlq_' + Math.random().toString(36).substring(2, 8),
              job_id: state.activeJobId,
              document_id: state.activeDocId,
              error_classification: 'OPERATOR_REJECTED',
              error_message: 'Rejected during Human-in-the-Loop review by lead.operator',
              stack_trace: 'HITL Reviewer Quarantine: Operator rejected extracted entities due to tax validation mismatch.',
              retry_count: 0,
              max_retries: 3,
              enqueued_at: new Date().toISOString()
            });
            showToast('error', 'Batch Quarantined', `Document ${state.activeDocId} moved to DLQ.`);
            state.activeTab = 'observability';
            render();
          });
        }

        const btnApprove = document.getElementById('btn-approve');
        if (btnApprove) {
          btnApprove.addEventListener('click', async () => {
            state.isApproving = true;
            render();
            await fetch('/api/v1/runtime/feedback', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                document_id: state.activeDocId,
                field_name: 'tax_amount',
                original_value: '870.38',
                corrected_value: '870.38',
                distillation_type: 'RULE',
                operator_notes: 'Operator confirmed tax rule'
              })
            }).catch(() => {});
            state.isApproving = false;
            state.isApproved = true;
            showToast('success', 'Schema Persisted', `Feedback calibrated and saved for ${state.activeDocId}.`);
            render();
            setTimeout(() => {
              state.activeTab = 'observability';
              render();
            }, 800);
          });
        }
      }

      // Global keyboard listener for Cmd+K / Ctrl+K
      window.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault();
          state.isSpotlightOpen = !state.isSpotlightOpen;
          render();
        } else if (e.key === 'Escape' && state.isSpotlightOpen) {
          state.isSpotlightOpen = false;
          render();
        }
      });

      window.probeBackendHealth = probeBackendHealth;

      document.addEventListener('DOMContentLoaded', render);
      if (document.readyState === 'complete' || document.readyState === 'interactive') render();
    })();
  </script>
</body>
</html>
