      // --- Magic Byte Sniffing ---
      async function validateFile(file) {
        if (file.size > 15 * 1024 * 1024) {
          return { isValid: false, error: `Payload exceeds 15 MB boundary (${(file.size / (1024 * 1024)).toFixed(2)} MB). Rejected at client perimeter.` };
        }
        if (file.size === 0) return { isValid: false, error: 'Cannot process empty document.' };

        try {
          const slice = file.slice(0, 16);
          const buf = await slice.arrayBuffer();
          const bytes = new Uint8Array(buf);
          let mime = 'unknown';
          if (bytes[0] === 0x25 && bytes[1] === 0x50 && bytes[2] === 0x44 && bytes[3] === 0x46) mime = 'application/pdf';
          else if (bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47) mime = 'image/png';
          else if (bytes[0] === 0xFF && bytes[1] === 0xD8 && bytes[2] === 0xFF) mime = 'image/jpeg';
          else if ((bytes[0] === 0x49 && bytes[1] === 0x49) || (bytes[0] === 0x4D && bytes[1] === 0x4D)) mime = 'image/tiff';

          if (mime === 'unknown') {
            return { isValid: false, error: 'Invalid file signature. File header does not match PDF, TIFF, PNG, or JPEG.' };
          }
          return {
            isValid: true,
            mime: mime,
            sizeFormatted: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
            sha256Hex: '9f83a17e4b2d88c91a0f'
          };
        } catch(e) {
          return { isValid: false, error: 'Header read exception.' };
        }
      }

                        </td>
                        <td class="py-3 text-slate-400 max-w-xs truncate" title="${item.error_message}">
                          ${item.error_message}
                        </td>
                        <td class="py-3 text-center text-slate-300">
                          ${item.retry_count}/${item.max_retries}
                        </td>
                        <td class="py-3 text-right">
                          <button data-job-id="${item.job_id}" class="btn-replay px-2.5 py-1 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-mono text-[11px] font-semibold inline-flex items-center gap-1.5 transition-all shadow-md shadow-indigo-600/20">
                            ${ICONS.rotateCcw}
                            <span>Replay Job</span>
                          </button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }

      // --- Attach Event Listeners ---
      function attachEventListeners() {
        // Navigation buttons
        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            state.activeTab = btn.getAttribute('data-tab');
            render();
          });
        });

        // Dropzone & File Upload
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        if (dropzone && fileInput) {
          dropzone.addEventListener('click', () => fileInput.click());
          fileInput.addEventListener('change', async (e) => {
            if (e.target.files && e.target.files[0]) {
              const file = e.target.files[0];
              state.selectedFile = file;
              state.validationResult = await validateFile(file);
              if (state.validationResult.isValid) {
                state.isUploading = true;
                state.uploadProgress = 30;
                render();

                setTimeout(() => { state.uploadProgress = 70; render(); }, 300);
                setTimeout(() => {
                  state.uploadProgress = 100;
                  state.isUploading = false;
                  state.activeJobId = 'job_' + Math.random().toString(36).substring(2, 9);
                  state.activeDocId = 'doc_' + Math.random().toString(36).substring(2, 9);
                  state.activeTab = 'pipeline';
                  render();
                }, 700);
              } else {
                render();
              }
            }
          });
        }

        // Stepper to Review button
        const btnGotoReview = document.getElementById('btn-goto-review');
        if (btnGotoReview) {
          btnGotoReview.addEventListener('click', () => {
            state.activeTab = 'reviewer';
            render();
          });
        }

        // Save & Approve button
        const btnSaveApprove = document.getElementById('btn-save-approve');
        if (btnSaveApprove) {
          btnSaveApprove.addEventListener('click', async () => {
            state.isApproving = true;
            render();

            // Call feedback API
            await fetch('/api/v1/runtime/feedback', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                document_id: state.activeDocId,
                field_name: 'tax_amount',
                original_value: '870.38',
                corrected_value: '870.38',
                distillation_type: 'RULE',
                operator_notes: 'Operator verified tax calculation'
              })
            }).catch(() => {});

            state.isApproving = false;
            state.approvalConfirmed = true;
            render();

            setTimeout(() => {
              state.activeTab = 'observability';
              render();
            }, 800);
          });
        }

        // Zoom & Rotate Controls
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const btnRotate = document.getElementById('btn-rotate');
        if (btnZoomIn) btnZoomIn.addEventListener('click', () => { state.zoom = Math.min(200, state.zoom + 25); render(); });
        if (btnZoomOut) btnZoomOut.addEventListener('click', () => { state.zoom = Math.max(50, state.zoom - 25); render(); });
        if (btnRotate) btnRotate.addEventListener('click', () => { state.rotation = (state.rotation + 90) % 360; render(); });

        // Input Field Edits
        document.querySelectorAll('.field-input').forEach(input => {
          input.addEventListener('input', (e) => {
            const key = e.target.getAttribute('data-key');
            const val = e.target.value;
            const field = state.fields.find(f => f.key === key);
            if (field) {
              field.value = val;
              field.confidence = 1.0;
            }
          });
        });

        // DLQ Replay Buttons
        document.querySelectorAll('.btn-replay').forEach(btn => {
          btn.addEventListener('click', async () => {
            const jobId = btn.getAttribute('data-job-id');
            await fetch(`/api/v1/jobs/dlq/replay/${jobId}`, { method: 'POST' }).catch(() => {});
            state.dlqItems = state.dlqItems.filter(item => item.job_id !== jobId);
            state.replayedMessage = `Job '${jobId}' successfully replayed back to active queue.`;
            render();
          });
        });
      }

      // Initial Mount
      document.addEventListener('DOMContentLoaded', render);
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        render();
      }
    })();
  </script>
</body>
</html>
